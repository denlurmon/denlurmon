<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДЭН ЛЮРМОН</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Stratos:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glitch" data-text="ДЭН ЛЮРМОН">ДЭН ЛЮРМОН</div>
    
    <nav class="nav">
        <a href="index.html">ГЛАВНАЯ</a>
        <a href="songs.html">ПЕСНИ</a>
        <a href="news.html">НОВОСТИ</a>
        <a href="contacts.html">КОНТАКТЫ</a>
    </nav>

    <main class="site-main">
        <section id="hero">
            <video autoplay loop muted playsinline class="bg-video">
                <source src="video-bg.mp4" type="video/mp4">
                Ваш браузер не поддерживает видео.
            </video>
            <div class="overlay"></div>
            <p class="subtitle">новосибирский андеграунд</p>
            <button class="btn-play" id="playBtn">ВКЛЮЧИТЬ ЗВУК</button>
        </section>
    </main>

    <footer class="site-footer">
        <p>Для концертов: <a href="mailto:booking@denlurmon.ru">booking@denlurmon.ru</a></p>
        <p>&copy; 2026 Дэмон Люрмон</p>
    </footer>

    <script>
        const video = document.querySelector('.bg-video');
        const btn = document.getElementById('playBtn');
        btn.addEventListener('click', function() {
            if (video.muted) {
                video.muted = false;
                btn.textContent = 'ВЫКЛЮЧИТЬ ЗВУК';
            } else {
                video.muted = true;
                btn.textContent = 'ВКЛЮЧИТЬ ЗВУК';
            }
        });
    </script>
</body>
</html>
